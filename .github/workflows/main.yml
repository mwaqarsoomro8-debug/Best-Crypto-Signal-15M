name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
       - name: Accept licenses and install SDK
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"  

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_SDK_ROOT}" || true
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP project
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            echo "Files found in extracted project:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist

          MAPFILE=$(find "$PROJECT_DIR" -type f \( -path '*/build/outputs/apk/*/*.apk' -o -path '*/build/outputs/apk/*.apk' \) -print)

          if [ -z "$MAPFILE" ]; then
            echo "ERROR: Build finished but no APK was found"
            find "$PROJECT_DIR" -type f | grep -E '/build/outputs/|\.apk$' | head -50 || true
            exit 1
          fi

          echo "$MAPFILE" | while IFS= read -r apk; do
            cp "$apk" dist/
          done

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
