name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Best-Crypto-Signal-15minute.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Extract source code zip
        run: |
          unzip -o Best-Crypto-Signal-15minute.zip -d extracted_content
          
          mv extracted_content/Best-Crypto-Signal-15minute/* . || true
          mv extracted_content/Best-Crypto-Signal-15minute/.* . || true
          rm -rf extracted_content

      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      
      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      
      - name: Set up Gradle and Generate Wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      
      - name: Make gradlew executable
        run: chmod +x gradlew

      
      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
