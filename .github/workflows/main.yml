
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Best-Crypto-Signal-15minute.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o Best-Crypto-Signal-15minute.zip -d extracted

          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project or app/build.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("*.gradle.kts"))
          files += list(root.rglob("*.gradle"))

          for path in files:
              text = path.read_text()
              original = text

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              text = re.sub(
                  r'(?i)(jvmTarget\s*=\s*["\'])1\.8(["\'])',
                  r'\g<1>17\2',
                  text
              )
              text = re.sub(
                  r'(?i)(sourceCompatibility|targetCompatibility)'
                  r'(\s*=\s*)["\']1\.8["\']',
                  r'\1\2JavaVersion.VERSION_17',
                  text
              )

              if text != original:
                  path.write_text(text)
                  print("Updated:", path)
          PY

      - name: Build Android Debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Best-Crypto-Signal-15M-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
