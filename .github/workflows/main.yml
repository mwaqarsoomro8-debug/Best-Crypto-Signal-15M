name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Best-Crypto-Signal-15minute.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Extract source code zip
        run: |
          unzip -o Best-Crypto-Signal-15minute.zip -d extracted_content
          
          mv extracted_content/Best-Crypto-Signal-15minute/* . || true
          mv extracted_content/Best-Crypto-Signal-15minute/.* . || true
          rm -rf extracted_content

      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      
      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      
      - name: Set up Gradle and Generate Wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE" -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Android project files not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      
      - name: Build Android Release APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon


      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
