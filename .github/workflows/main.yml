
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Best-Crypto-Signal-15minute.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Align Java and Kotlin targets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.rglob("*.gradle.kts"))
          files += list(root.rglob("*.gradle"))

          for path in files:
              text = path.read_text()
              original = text

              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              text = re.sub(
                  r'(?i)(jvmTarget\s*=\s*["\'])1\.8(["\'])',
                  r'\g<1>17\2',
                  text
              )
              text = re.sub(
                  r'(?i)(sourceCompatibility|targetCompatibility)'
                  r'(\s*=\s*)["\']1\.8["\']',
                  r'\1\2JavaVersion.VERSION_17',
                  text
              )

              if text != original:
                  path.write_text(text)
                  print("Updated:", path)
          PY

        - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: extracted/*/build/outputs/apk/debug/.apk
          if-no-files-found: error
          retention-days: 7
